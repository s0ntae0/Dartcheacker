<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>찌라시체크 OG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* public/og.png 원본. 1200×630, 사이트 톤(v3 토큰) 그대로. 그라데이션·아이콘 세트 없음 */
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;background:#fff;color:#0B0F19;position:relative;overflow:hidden;
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
  .brand{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:16px;font-size:48px;font-weight:700;line-height:1}
  .brand svg{width:46px;height:46px;display:block}
  .score{position:absolute;right:72px;top:52px;display:flex;align-items:baseline;gap:16px;color:#C8102E}
  .score .n{font-size:96px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .score .tag{font-size:24px;font-weight:600;padding:6px 14px;border-radius:8px;background:#FFF1F2;line-height:1.2}
  h1{position:absolute;left:72px;top:238px;margin:0;font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
  .sub{position:absolute;left:72px;top:340px;font-size:28px;font-weight:400;color:#3B4252;line-height:1.4}
  .tags{position:absolute;left:72px;bottom:64px;display:flex;gap:12px}
  .t{border:1.5px solid #9AA1AE;border-radius:999px;padding:9px 20px;font-size:20px;font-weight:500;color:#3B4252;line-height:1.2;background:#fff}
  .url{position:absolute;right:72px;bottom:74px;font-size:22px;font-weight:500;color:#6B7280;line-height:1}
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="16" height="16" rx="4" stroke="#0B0F19" stroke-width="1.6"/>
      <path d="M5 9.2l2.6 2.6L13 6.6" stroke="#0B0F19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    찌라시체크
  </div>
  <div class="score"><div class="n">92</div><span class="tag">높음</span></div>
  <h1>받은 메시지, 공시로 확인하세요</h1>
  <div class="sub">리딩방·SNS 주식 메시지 → 사기 수법 16종 대조 + DART 공시 근거 확인</div>
  <div class="tags"><span class="t">금융감독원 소비자경보 기준</span><span class="t">OpenDART 실시간</span><span class="t">판정 근거 전부 인용</span></div>
  <div class="url">dartcheacker.vercel.app</div>
</body>
</html>
